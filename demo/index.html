<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sumnight Members</title>
<meta name="description" content="sumnight — a private membership to Thailand's most considered hotels, tables and spas. Interactive MVP demo.">
<meta name="theme-color" content="#0D0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap">
<style>
/* ============ Tokens ============ */
:root{
  --ink:#0D0B0C; --ink-2:#161213; --ink-3:#221C1E; --line-d:#3A3134;
  --bone:#F5F0ED; --bone-2:#EDE5E1; --bone-3:#E3D8D4; --line-l:#D8CCC8;
  --text-l:#1A1517; --mute-l:#77696D; --text-d:#F2EAE7; --mute-d:#A69A9D;
  --pink:#EFA9BC; --pink-2:#E58AA3; --pink-ink:#A84A67; --pink-wash:#F8E3E9;
  --ok:#4F8A62; --ok-wash:#E1EEE4; --warn:#B57A22; --warn-wash:#F6EAD5;
  --bad:#B14B45; --bad-wash:#F5DEDC; --info:#4E6A9E; --info-wash:#E0E7F3;
  --line-green:#06C755;
  --th-head:"Trirong"; --th-body:"Anuphan";
  --serif:"Bodoni Moda",var(--th-head),"Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost",var(--th-body),"Noto Sans Thai","Helvetica Neue",Arial,sans-serif;
  --gut:clamp(16px,5vw,72px);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--text-l);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:1.5px solid var(--pink-2);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:400}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Photo holder: gradient ground so a missing image still reads as intentional */
.ph{position:relative;overflow:hidden;background:
  radial-gradient(120% 80% at 80% 10%,rgba(239,169,188,.28),transparent 60%),
  radial-gradient(90% 70% at 10% 90%,rgba(120,96,104,.5),transparent 70%),
  linear-gradient(160deg,#2a2224,#0f0c0d)}
.ph img{width:100%;height:100%;object-fit:cover}

/* Logo (wordmark placeholder — swap for the official file) */
.logo{font-family:"Bodoni Moda","Didot",Georgia,serif;font-size:26px;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline;line-height:1}
.logo i{display:inline-block;width:.24em;height:.24em;border-radius:50%;background:var(--pink);margin-left:.06em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid currentColor;background:transparent;padding:14px 26px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:400;text-decoration:none;transition:background .3s var(--ease),color .3s var(--ease),border-color .3s}
.btn-pink{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.btn-pink:hover{background:var(--pink-2);border-color:var(--pink-2)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--bone)}
.btn-ink:hover{background:var(--ink-3)}
.btn-ghost-d{color:var(--text-d);border-color:rgba(242,234,231,.5)}
.btn-ghost-d:hover{border-color:var(--pink);color:var(--pink)}
.btn-ghost-l{color:var(--text-l);border-color:var(--line-l)}
.btn-ghost-l:hover{border-color:var(--ink)}
.btn-sm{padding:9px 14px;font-size:10.5px;letter-spacing:.18em}
.link{background:none;border:0;padding:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:2px}

/* ============ Sales page ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gut) 18px;color:var(--text-d);transition:background .4s var(--ease),padding .4s var(--ease)}
.nav.solid{background:rgba(13,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:12px}
.nav-links{display:flex;gap:34px;align-items:center}
.nav-links button{background:none;border:0;padding:0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--text-d);opacity:.85}
.nav-links button:hover{opacity:1;color:var(--pink)}
@media (max-width:860px){.nav-links .hide-m{display:none}}

.hero{position:relative;min-height:min(92vh,880px);display:grid;align-items:end;color:var(--text-d);padding:140px var(--gut) clamp(48px,8vh,96px);overflow:hidden;background:var(--ink)}
.hero .ph{position:absolute;inset:0}
.hero .ph img{transform:scale(1.06);animation:heroIn 2.4s var(--ease) forwards}
@keyframes heroIn{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,11,12,.55) 0%,rgba(13,11,12,.05) 35%,rgba(13,11,12,.75) 100%)}
.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end}
.hero h1{grid-column:1/9;font-size:clamp(46px,7.4vw,112px);line-height:.94;font-weight:400}
.hero h1 em{font-style:italic;color:var(--pink)}
.hero-side{grid-column:9/13;display:grid;gap:26px;padding-bottom:10px}
.hero-side p{font-size:17px;color:rgba(242,234,231,.86);max-width:36ch}
.hero .eyebrow{grid-column:1/-1;color:var(--pink)}
@media (max-width:860px){.hero h1,.hero-side{grid-column:1/-1}}

.sec{padding:clamp(72px,11vw,150px) var(--gut)}
.sec-d{background:var(--ink);color:var(--text-d)}
.sec-2{background:var(--bone-2)}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.intro .eyebrow{grid-column:1/4;color:var(--pink-ink);padding-top:14px}
.intro h2{grid-column:4/12;font-size:clamp(28px,3.6vw,50px);line-height:1.18}
.intro h2 em{color:var(--pink-ink)}
.intro p{grid-column:4/9;color:var(--mute-l);font-size:17px;margin-top:8px}
@media (max-width:860px){.intro .eyebrow,.intro h2,.intro p{grid-column:1/-1}}

.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.4vw,36px);margin-top:clamp(56px,7vw,96px)}
.pillar .ph{aspect-ratio:3/4;max-width:100%}
.pillar .ph img{transition:transform 1.4s var(--ease)}
.pillar:hover .ph img{transform:scale(1.04)}
.pillar h3{font-size:30px;margin-top:22px}
.pillar p{color:var(--mute-l);margin-top:6px;max-width:34ch}
.pillar .eyebrow{color:var(--mute-l);margin-top:18px}
.pillar:nth-child(2){margin-top:64px}
@media (max-width:860px){.pillars{grid-template-columns:1fr}.pillar:nth-child(2){margin-top:0}}

.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:48px}
.sec-head h2{font-size:clamp(34px,4.4vw,62px);line-height:1.02}
.sec-head .eyebrow{color:var(--pink);margin-bottom:18px}
.sec-head p{max-width:40ch;color:var(--mute-d)}
.sec:not(.sec-d) .sec-head .eyebrow{color:var(--pink-ink)}
.sec:not(.sec-d) .sec-head p{color:var(--mute-l)}

.houses{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:24px;overflow-x:auto;padding-bottom:18px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--line-d) transparent}
.house{scroll-snap-align:start}
.house .ph{aspect-ratio:4/5}
.house-meta{display:flex;justify-content:space-between;gap:12px;margin-top:16px;align-items:baseline}
.house h3{font-size:24px}
.house .eyebrow{color:var(--mute-d);font-size:10px}
.house .cat{color:var(--pink);font-size:10px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line-l)}
.tier{padding:44px 36px 40px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line-l)}
.tier:last-child{border-right:0}
.tier.feature{background:var(--ink);color:var(--text-d);position:relative}
.tier.feature::before{content:"";position:absolute;inset:10px;border:1px solid rgba(239,169,188,.45);pointer-events:none}
.tier h3{font-size:40px;font-style:italic}
.tier .fee{font-family:var(--serif);font-size:26px}
.tier .per{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute-l)}
.tier.feature .per,.tier.feature .tline{color:var(--mute-d)}
.tier .tline{color:var(--mute-l);min-height:3.2em}
.tier ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;border-top:1px solid var(--line-l);padding-top:22px;flex:1}
.tier.feature ul{border-color:var(--line-d)}
.tier li{display:flex;gap:12px;font-size:15px}
.tier li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--pink-2);margin-top:.65em}
.tier .btn{align-self:flex-start}
@media (max-width:900px){.tiers{grid-template-columns:1fr}.tier{border-right:0;border-bottom:1px solid var(--line-l)}.tier:last-child{border-bottom:0}}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;counter-reset:s}
.step{border-top:1px solid var(--line-l);padding-top:22px}
.step .n{font-family:var(--serif);font-style:italic;font-size:44px;color:var(--pink-ink);line-height:1}
.step h4{font-size:22px;margin:14px 0 8px}
.step p{color:var(--mute-l);font-size:15px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

.split{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(32px,6vw,96px);align-items:center}
.split .ph{aspect-ratio:4/5}
.split h2{font-size:clamp(34px,4.2vw,58px);line-height:1.04;margin:18px 0 22px}
.split .eyebrow{color:var(--pink)}
.split p{color:var(--mute-d);max-width:44ch}
.plist{list-style:none;padding:0;margin:30px 0 36px;display:grid;gap:0}
.plist li{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line-d);font-size:15px}
.plist li b{font-weight:400;color:var(--pink);font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding-top:3px}
@media (max-width:860px){.split{grid-template-columns:1fr}.plist li{grid-template-columns:1fr;gap:4px}}

.apply{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(32px,6vw,96px)}
.apply h2{font-size:clamp(38px,5vw,72px);line-height:1}
.apply h2 em{color:var(--pink)}
.apply .lead{color:var(--mute-d);margin-top:22px;max-width:36ch}
.apply .meta{margin-top:36px;display:grid;gap:6px;color:var(--mute-d);font-size:14px}
.apply .meta b{color:var(--text-d);font-weight:400}
.form{display:grid;grid-template-columns:1fr 1fr;gap:26px 24px}
.form .full{grid-column:1/-1}
.fld{display:grid;gap:8px}
.fld label,.fld .lbl{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute-d)}
.fld input,.fld select,.fld textarea{background:transparent;border:0;border-bottom:1px solid var(--line-d);padding:10px 0;color:var(--text-d);font-size:17px;border-radius:0;outline:none;transition:border-color .3s}
.fld select option{color:#111}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line-d);background:transparent;color:var(--text-d);padding:9px 16px;font-size:13px;letter-spacing:.06em;border-radius:40px;transition:all .25s}
.chip.on{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--mute-d)}
.consent input{accent-color:var(--pink);margin-top:4px;width:16px;height:16px;flex:none}
.form-err{color:var(--pink);font-size:13px}
@media (max-width:860px){.apply{grid-template-columns:1fr}.form{grid-template-columns:1fr}}

.foot{background:var(--ink);color:var(--mute-d);padding:56px var(--gut) calc(110px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-d);display:flex;flex-wrap:wrap;gap:24px 48px;justify-content:space-between;align-items:end;font-size:13px}
.foot .logo{color:var(--text-d);font-size:40px}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(13,11,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bone);color:var(--text-l);width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;animation:rise .5s var(--ease)}
@keyframes rise{from{transform:translateY(18px);opacity:0}}
.modal .ph{min-height:260px}
.modal-body{padding:40px 36px;display:grid;gap:18px;align-content:start}
.modal-body h3{font-size:36px;line-height:1.05}
.modal-body .pos{font-family:var(--serif);font-size:64px;line-height:1;color:var(--pink-ink)}
.modal-body p{color:var(--mute-l)}
.qrbox{display:flex;gap:16px;align-items:center;border:1px solid var(--line-l);padding:14px;background:#fff}
.qrbox small{font-size:12px;color:var(--mute-l);line-height:1.45}
.qrbox b{font-weight:500;color:var(--text-l);display:block;font-size:14px}
.btn-line{background:var(--line-green);border-color:var(--line-green);color:#fff;letter-spacing:.12em}
.btn-line:hover{background:#05b04b}
@media (max-width:700px){.modal{grid-template-columns:1fr}.modal .ph{min-height:160px}}

/* ============ Thai typography ============ */
html[lang=th]{--serif:var(--th-head),"Bodoni Moda",Georgia,serif;--sans:var(--th-body),"Jost",Arial,sans-serif}
html[lang=th] body{line-height:1.75}
html[lang=th] em{font-style:normal}
html[lang=th] h1,html[lang=th] h2,html[lang=th] h3,html[lang=th] h4,html[lang=th] h5{line-height:1.35!important;letter-spacing:0}
html[lang=th] .hero h1{font-size:clamp(40px,6.2vw,92px);line-height:1.2!important}
html[lang=th] .intro h2{font-size:clamp(26px,3.2vw,44px)}
html[lang=th] :is(.eyebrow,.btn,.link,.nav-links button,.fld label,.fld .lbl,.tabbar button,.rich button,th,.tier .per,.pill,.jstep h4,.qa button,.seg button,.backlink,.side .sub,.flex-btn,.house .cat,.plist li b,.vch .r,.dates button,.dsec h6,.demo-note b,.qrfull small,.mcard .nm,.mcard .no,.side .role label){letter-spacing:.03em}
html[lang=th] .step .n,html[lang=th] .jstep .k,html[lang=th] .tier h3,html[lang=th] .tchip,html[lang=th] .mcard .tn{font-family:"Bodoni Moda",Georgia,serif}
.fontpop{position:fixed;z-index:92;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 24px));max-height:min(70vh,560px);overflow-y:auto;background:var(--bone);color:var(--text-l);border:1px solid var(--line-l);box-shadow:0 30px 80px rgba(0,0,0,.35);padding:18px;display:grid;gap:10px;animation:rise .3s var(--ease)}
@media (min-width:981px){.fontpop{left:20px;transform:none}}
.fontpop .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fontpop .hd b{font-family:"Bodoni Moda",Georgia,serif;font-weight:400;font-size:20px}
.fontpop .hd small{color:var(--mute-l);font-size:12px}
.fopt{display:grid;gap:4px;text-align:left;background:#fff;border:1px solid var(--line-l);padding:12px 14px}
.fopt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fopt .n{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-ink);display:flex;justify-content:space-between;gap:8px}
.fopt .h{font-size:24px;line-height:1.35}
.fopt .b{font-size:14px;color:var(--mute-l);line-height:1.6}
.nav .lang{background:none;border:1px solid rgba(242,234,231,.35);color:var(--text-d);border-radius:30px;padding:6px 11px;font-size:11px;letter-spacing:.08em}

/* ============ Demo bar ============ */
.demobar{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:rgba(13,11,12,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line-d);border-radius:40px;padding:5px;color:var(--text-d);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.demobar::-webkit-scrollbar{display:none}
@media (min-width:981px){.demobar{left:20px;transform:none}}
@media (max-width:560px){.demobar .lg,.demobar .tag{display:none}.demobar a,.demobar button{padding:8px 11px}}
.demobar .tag{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--pink);padding:0 10px 0 12px;white-space:nowrap}
.demobar a,.demobar button{white-space:nowrap;font-size:12px;letter-spacing:.04em;text-decoration:none;border:0;background:transparent;color:var(--mute-d);padding:8px 14px;border-radius:30px}
.demobar a.on{background:var(--bone);color:var(--ink)}
.demobar a:hover{color:var(--text-d)}
.demobar a.on:hover{color:var(--ink)}
.demobar .sep{width:1px;height:18px;background:var(--line-d);margin:0 4px;flex:none}

/* ============ LINE journey ============ */
.journey{min-height:100vh;background:var(--ink);color:var(--text-d);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,80px);padding:calc(28px + env(safe-area-inset-top,0px)) var(--gut) 110px;align-items:start}
.j-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.j-top .logo{color:var(--text-d)}
.j-narr{max-width:560px;padding-top:24px}
.j-narr h1{font-size:clamp(34px,4vw,56px);line-height:1.02;margin:16px 0 14px}
.j-narr h1 em{color:var(--pink)}
.j-narr>p{color:var(--mute-d);max-width:46ch}
.jsteps{list-style:none;margin:36px 0 28px;padding:0;display:grid}
.jstep{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;padding:16px 0;border-top:1px solid var(--line-d);opacity:.5;transition:opacity .3s}
.jstep:last-child{border-bottom:1px solid var(--line-d)}
.jstep .k{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--mute-d);line-height:1.1}
.jstep h4{font-family:var(--sans);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.jstep p{grid-column:2;color:var(--mute-d);font-size:14.5px}
.jstep.done{opacity:.75}
.jstep.done .k{color:var(--pink)}
.jstep.now{opacity:1}
.jstep.now .k{color:var(--pink)}
.jstep.now h4{color:var(--pink)}
.j-actions{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:980px){.journey{grid-template-columns:1fr}.j-phone-wrap{order:-1;justify-self:center}.j-narr{padding-top:0}.j-top{order:-2}}

/* Phone */
.phone{width:min(392px,calc(100vw - 32px));height:min(812px,calc(100vh - 150px));min-height:620px;background:#000;border-radius:52px;padding:11px;box-shadow:0 0 0 1px #2c2427,0 40px 120px rgba(0,0,0,.6),inset 0 0 0 2px #1d1719;position:relative}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:#fff;color:#111;position:relative;display:flex;flex-direction:column;font-family:var(--sans)}
.sbar{height:46px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-size:14px;font-weight:500;position:relative;z-index:5}
.sbar .isl{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:108px;height:30px;background:#000;border-radius:20px}
.sbar .ic{display:flex;gap:6px;align-items:center}
.sbar-d{background:var(--ink);color:#fff}
.sbar-l{background:#fff;color:#111}

/* LINE chat */

.lhead .icons{display:flex;gap:16px;color:#333;font-size:15px}
.lbody{flex:1;overflow-y:auto;background:#A7B7CF;padding:14px 12px 18px;display:flex;flex-direction:column;gap:12px}

.lav{width:34px;height:34px;border-radius:50%;background:var(--ink);flex:none;display:grid;place-items:center;align-self:flex-start}
.lav .logo{font-size:10px;color:#fff}
.lbub{background:#fff;border-radius:18px;padding:9px 13px;font-size:14px;line-height:1.5;white-space:pre-line;font-family:var(--sans);font-weight:400}

.ltime{font-size:10px;color:rgba(0,0,0,.45);white-space:nowrap}
.flex{background:#fff;border-radius:18px;overflow:hidden;width:250px}
.flex .ph{height:130px}
.flex-b{padding:14px 16px 6px;display:grid;gap:4px}
.flex-b .eyebrow{font-size:9px;color:var(--pink-ink)}

.flex-btn{margin:12px 14px 14px;display:block;width:calc(100% - 28px);background:var(--ink);color:#fff;border:0;padding:11px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;border-radius:8px}
.rich{flex:none;background:var(--ink);display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #000}

.rich svg{width:22px;height:22px;stroke:var(--pink);fill:none;stroke-width:1.3}
.rich-lbl{flex:none;background:#fff;text-align:center;font-size:12px;color:#666;padding:7px 0 calc(7px);border-top:1px solid #eee}

/* LINE consent sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .3s}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:22px 22px 30px;animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .appi{width:54px;height:54px;border-radius:14px;background:var(--ink);display:grid;place-items:center;margin:0 auto 10px}
.sheet .appi .logo{color:#fff;font-size:13px}
.sheet h6{text-align:center;font-size:16px;font-weight:500;margin:0}
.sheet .sub{text-align:center;font-size:12px;color:#888;margin:2px 0 18px}
.perm{display:grid;gap:0;border-top:1px solid #eee;margin-bottom:18px}
.perm div{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid #eee;font-size:13px;font-weight:400}
.perm span:last-child{color:var(--line-green);font-weight:500}
.lbtn{display:block;width:100%;background:var(--line-green);color:#fff;border:0;border-radius:8px;padding:13px;font-size:15px;font-weight:500}
.lbtn2{display:block;width:100%;background:none;border:0;padding:12px;font-size:14px;color:#888}

/* LIFF */
.liffbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px 10px;background:#fff;border-bottom:1px solid #ececec}
.liffbar .x{border:0;background:none;font-size:22px;line-height:1;padding:0 2px;color:#222}
.liffbar .t{flex:1;text-align:center;line-height:1.2}
.liffbar .t b{display:block;font-size:14px;font-weight:500}
.liffbar .t small{font-size:10.5px;color:#999}
.liffbar .dots{font-size:18px;color:#444;letter-spacing:1px}
.lf{flex:1;overflow-y:auto;background:var(--bone);color:var(--text-l);position:relative}
.lf-pad{padding:26px 22px 30px}
.lf h2{font-size:30px;line-height:1.08}
.lf h2 em{color:var(--pink-ink)}
.lf .lead{color:var(--mute-l);font-size:14px;margin-top:8px}
.lform{display:grid;gap:18px;margin-top:24px}
.lform .fld label,.lform .fld .lbl{color:var(--mute-l);font-size:9.5px}
.lform .fld input,.lform .fld select,.lform .fld textarea{color:var(--text-l);border-color:var(--line-l);font-size:15px;padding:8px 0}
.lform .fld input:focus,.lform .fld select:focus,.lform .fld textarea:focus{border-color:var(--pink-ink)}
.lform .chip{border-color:var(--line-l);color:var(--text-l);font-size:12.5px;padding:7px 13px}
.lform .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bone)}
.lform .consent{color:var(--mute-l);font-size:12px}
.lform .consent input{accent-color:var(--ink)}
.lform .form-err{color:var(--bad)}
.lf .btn{width:100%}
.verified{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line-l);padding:10px 12px;font-size:12px;color:var(--mute-l);margin-top:18px}
.verified img,.verified .av{width:34px;height:34px;border-radius:50%;background:var(--pink-wash);display:grid;place-items:center;font-family:var(--serif);color:var(--pink-ink);font-size:15px;flex:none}
.verified b{color:var(--text-l);font-weight:500;display:block;font-size:13px}

.tl{list-style:none;margin:26px 0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:18px;position:relative;font-size:14px}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;border:1px solid var(--line-l);background:var(--bone);margin:6px 0 0 6px;position:relative;z-index:1}
.tl li::after{content:"";position:absolute;left:10px;top:16px;bottom:0;width:1px;background:var(--line-l)}
.tl li:last-child::after{display:none}
.tl li.d::before{background:var(--ink);border-color:var(--ink)}
.tl li.n::before{background:var(--pink-2);border-color:var(--pink-2);box-shadow:0 0 0 4px var(--pink-wash)}
.tl small{display:block;color:var(--mute-l);font-size:12px}
.demo-note{border:1px dashed var(--pink-2);background:var(--pink-wash);padding:14px;font-size:12.5px;color:var(--pink-ink);display:grid;gap:10px}
.demo-note b{font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:9.5px}
.demo-note .row{display:flex;gap:8px;flex-wrap:wrap}

/* Member app */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line-l);padding:6px 4px 12px}
.tabbar button{background:none;border:0;display:grid;justify-items:center;gap:3px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-l);padding:6px 0}
.tabbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.3}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{stroke:var(--pink-ink)}
.tabbar .dot{position:relative}
.tabbar .dot::after{content:"";position:absolute;top:0;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--pink-2)}
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hello h2{font-size:26px}
.hello .eyebrow{color:var(--mute-l);font-size:9.5px}
.mcard{margin-top:18px;aspect-ratio:1.586;max-width:100%;border-radius:14px;padding:18px 20px;color:var(--text-d);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:
  radial-gradient(90% 120% at 100% 0%,rgba(239,169,188,.45),transparent 55%),
  radial-gradient(70% 90% at 0% 100%,rgba(239,169,188,.12),transparent 60%),
  linear-gradient(135deg,#1c1618,#0b090a);box-shadow:0 18px 40px rgba(13,11,12,.3);border:0;text-align:left;width:100%}
.mcard.Midnight{background:radial-gradient(90% 120% at 100% 0%,rgba(239,169,188,.7),transparent 55%),radial-gradient(70% 90% at 0% 100%,rgba(122,80,160,.35),transparent 60%),linear-gradient(135deg,#1a1216,#050405)}
.mcard.Eclipse{background:radial-gradient(60% 80% at 70% 30%,#000 40%,rgba(239,169,188,.9) 41%,transparent 62%),linear-gradient(135deg,#111,#000)}
.mcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.mcard .logo{font-size:22px;color:var(--text-d)}
.mcard .tn{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--pink)}
.mcard .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.mcard .nm{font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.mcard .no{font-size:11px;letter-spacing:.2em;color:var(--mute-d)}
.mcard .qr-mini{background:#fff;padding:4px;border-radius:4px;line-height:0}
.progress{margin-top:22px;display:grid;gap:8px}
.progress .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute-l)}
.progress .row b{color:var(--text-l);font-weight:500}
.bar{height:3px;background:var(--bone-3);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pink-ink)}
.mini-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px}
.mini-h h4{font-size:19px}
.mini-h button{font-size:10px}
.bk{display:grid;grid-template-columns:62px 1fr;gap:12px;background:#fff;border:1px solid var(--line-l);padding:10px;align-items:center;width:100%;text-align:left}
.bk .ph{height:62px;width:62px}
.bk h5{font-family:var(--serif);font-size:16px;font-weight:400;margin:0;line-height:1.2}
.bk small{display:block;color:var(--mute-l);font-size:12px}
.bk + .bk{margin-top:8px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.qa button{background:#fff;border:1px solid var(--line-l);padding:14px 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;display:grid;gap:6px;justify-items:center}
.qa svg{width:20px;height:20px;fill:none;stroke:var(--pink-ink);stroke-width:1.3}
.perk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line-l)}
.perk h5{font-size:15px;font-weight:400;font-family:var(--sans);margin:0}
.perk p{font-size:12px;color:var(--mute-l);grid-column:1}
.perk .cnt{font-size:12px;color:var(--pink-ink);text-align:right;white-space:nowrap}
.pdots{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.pdots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--pink-ink)}
.pdots i.u{background:var(--pink-ink)}
.vch{display:grid;grid-template-columns:1fr 92px;background:#fff;border:1px solid var(--line-l);position:relative;width:100%;text-align:left;padding:0}
.vch + .vch{margin-top:10px}
.vch .l{padding:14px 14px 12px;display:grid;gap:3px}
.vch .l .eyebrow{font-size:9px;color:var(--pink-ink)}
.vch h5{font-family:var(--serif);font-size:18px;font-weight:400;margin:0;line-height:1.15}
.vch small{font-size:11.5px;color:var(--mute-l)}
.vch .r{border-left:1px dashed var(--line-l);display:grid;place-items:center;align-content:center;gap:4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute-l);text-align:center;padding:8px}
.vch .r b{font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--text-l);font-weight:400}
.vch::before,.vch::after{content:"";position:absolute;right:84px;width:16px;height:16px;border-radius:50%;background:var(--bone);border:1px solid var(--line-l)}
.vch::before{top:-9px}.vch::after{bottom:-9px}
.vch.used{opacity:.5}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-top:18px}
.seg button{border:0;background:transparent;padding:10px 4px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.seg button.on{background:var(--ink);color:var(--bone)}
.vlist{display:grid;gap:12px;margin-top:16px}
.vcard{background:#fff;border:1px solid var(--line-l);text-align:left;padding:0;width:100%}
.vcard .ph{height:120px}
.vcard div.m{padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vcard h5{font-family:var(--serif);font-size:19px;font-weight:400;margin:0}
.vcard small{font-size:11px;color:var(--mute-l);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.bhero{height:150px;margin:-26px -22px 18px}
.bhero.ph{display:flex;align-items:flex-end}
.backlink{background:none;border:0;padding:0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute-l);margin-bottom:14px}
.dates{display:grid;grid-auto-flow:column;grid-auto-columns:52px;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{border:1px solid var(--line-l);background:#fff;padding:8px 0;display:grid;justify-items:center;gap:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute-l)}
.dates button b{font-family:var(--serif);font-size:19px;font-weight:400;color:var(--text-l);letter-spacing:0}
.dates button.on{background:var(--ink);border-color:var(--ink);color:var(--mute-d)}
.dates button.on b{color:var(--pink)}
.times{display:flex;flex-wrap:wrap;gap:6px}
.times button{border:1px solid var(--line-l);background:#fff;padding:8px 12px;font-size:13px}
.times button.on{background:var(--ink);border-color:var(--ink);color:var(--bone)}
.stepper{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-l);padding:6px 0}
.stepper div{display:flex;align-items:center;gap:16px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-l);background:#fff;font-size:16px;line-height:1}
.stepper b{font-family:var(--serif);font-weight:400;font-size:20px;min-width:22px;text-align:center}
.opt{display:grid;gap:6px}
.opt button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line-l);background:#fff;padding:10px 12px;text-align:left;font-size:13px}
.opt button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt button small{color:var(--mute-l);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:30px;white-space:nowrap;font-weight:400}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st-requested{background:var(--pink-wash);color:var(--pink-ink)}
.st-alternative{background:var(--info-wash);color:var(--info)}
.st-confirmed{background:var(--ok-wash);color:var(--ok)}
.st-completed,.st-cancelled{background:var(--bone-3);color:var(--mute-l)}
.st-declined,.st-noshow{background:var(--bad-wash);color:var(--bad)}
.trip{background:#fff;border:1px solid var(--line-l);padding:14px;display:grid;gap:8px}
.trip + .trip{margin-top:10px}
.trip .t1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.trip h5{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
.trip small{color:var(--mute-l);font-size:12.5px}
.trip .alt{background:var(--info-wash);color:var(--info);padding:10px;font-size:12.5px;display:grid;gap:8px}
.trip .alt .row{display:flex;gap:8px}
.trip .alt .btn{flex:1;width:auto}
.qrfull{position:absolute;inset:0;background:var(--ink);color:var(--text-d);z-index:15;display:grid;place-items:center;align-content:center;gap:16px;text-align:center;padding:30px;animation:fade .3s}
.qrfull .qrw{background:#fff;padding:14px;border-radius:10px;line-height:0}
.qrfull h3{font-size:26px}
.qrfull small{color:var(--mute-d);letter-spacing:.2em;text-transform:uppercase;font-size:11px}
.done-ico{width:58px;height:58px;border-radius:50%;border:1px solid var(--pink-ink);display:grid;place-items:center;margin-bottom:22px}
.done-ico svg{width:24px;stroke:var(--pink-ink);fill:none;stroke-width:1.5}
.ptoast{position:absolute;left:10px;right:10px;top:50px;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;padding:11px 13px;display:grid;grid-template-columns:34px 1fr;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:drop .5s var(--ease);color:#111;cursor:pointer}
@keyframes drop{from{transform:translateY(-120%);opacity:0}}
.ptoast .ai{width:34px;height:34px;border-radius:9px;background:var(--line-green);display:grid;place-items:center;color:#fff;font-weight:600;font-size:11px}
.ptoast b{font-size:13px;font-weight:500;display:flex;justify-content:space-between}
.ptoast b small{font-weight:300;color:#888;font-size:11px}
.ptoast p{font-size:12.5px;color:#333;line-height:1.4}

/* ============ Console ============ */
.con{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:var(--bone)}
.side{background:var(--ink);color:var(--text-d);padding:calc(24px + env(safe-area-inset-top,0px)) 18px 110px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{color:var(--text-d);padding:0 8px}
.side .sub{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--pink);padding:0 8px;margin-top:-18px}
.side nav{display:grid;gap:2px}
.side nav button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--mute-d);text-align:left;padding:10px 10px;font-size:14px;border-radius:6px}
.side nav button:hover{color:var(--text-d);background:var(--ink-3)}
.side nav button.on{color:var(--text-d);background:var(--ink-3)}
.side nav button .c{font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;background:var(--pink);color:var(--ink);font-variant-numeric:tabular-nums}
.side .role{display:grid;gap:8px;padding:14px 10px;border:1px solid var(--line-d);border-radius:8px}
.side .role label{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute-d)}
.side .role select{background:var(--ink-2);border:1px solid var(--line-d);color:var(--text-d);padding:8px;border-radius:6px;font-size:13px}
.side .role small{font-size:11.5px;color:var(--mute-d);line-height:1.45}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--mute-d);padding:0 8px}
.side .me .av{width:30px;height:30px;border-radius:50%;background:var(--pink);color:var(--ink);display:grid;place-items:center;font-family:var(--serif);flex:none}
.side .me b{display:block;color:var(--text-d);font-weight:400}
.main{padding:calc(28px + env(safe-area-inset-top,0px)) clamp(16px,3vw,44px) 120px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.mh h1{font-size:clamp(30px,3vw,42px);line-height:1.05}
.mh .eyebrow{color:var(--pink-ink);margin-bottom:10px}
.mh .r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line-l);background:#fff;padding:9px 12px;font-size:14px;min-width:0;width:220px;border-radius:0}
@media (max-width:900px){
  .con{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;gap:14px}
  .side nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;gap:4px;scrollbar-width:none}
  .side .sub{margin-top:-8px}
  .side .me{display:none}
  .search{width:100%}
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line-l);background:#fff}
.kpi{padding:20px 22px;border-right:1px solid var(--line-l);display:grid;gap:4px}

function trOne(k){ let v=DICT[k]; if(v!=null) return v; for(const [re,rep] of PATTERNS){ if(re.test(k)) return k.replace(re,rep); } return null; }
function tr(t){ if(LANG!=='th'||t==null) return t; const k=String(t).trim(); if(!k) return t; let v=trOne(k);
  if(v==null && k.includes(' · ')){ const parts=k.split(' · '); const out=parts.map(x=>trOne(x.trim())??x); if(out.some((x,i)=>x!==parts[i])) v=out.join(' · '); }
  return v==null?t:String(t).replace(k,v); }
function i18n(root){ if(LANG!=='th'||!root) return;
  if(root.nodeType===3){ if(root.parentElement&&!root.parentElement.closest('[data-noi18n],script,style')){ const v=tr(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v; } return; }
  if(root.closest&&root.closest('[data-noi18n],script,style')) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!n.parentElement.closest('[data-noi18n],script,style')?1:2});
  let n; while((n=w.nextNode())){ const v=tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; }
  const els=[root,...root.querySelectorAll('[placeholder],[aria-label],[title]')];
  els.forEach(el=>{ if(!el.getAttribute) return; ['placeholder','aria-label','title'].forEach(a=>{ const x=el.getAttribute(a); if(x){ const y=tr(x); if(y!==x) el.setAttribute(a,y); } }); });
}
new MutationObserver(ms=>{ if(LANG!=='th') return; for(const m of ms) for(const n of m.addedNodes) i18n(n); }).observe(document.documentElement,{childList:true,subtree:true});

function qr(text,size=120,fg='#0D0B0C',bg='#fff'){
  const n=25;let h=2166136261;for(const c of String(text)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}h|=1;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};
  const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!inF(x,y)&&rnd()>.5)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="${fg}"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="${bg}"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="${fg}"/>`;

function submitWaitlist(e){
  e.preventDefault();
  const f=e.target, err=$('#f-err');
  const name=f.name.value.trim(), email=f.email.value.trim();
  if(!name){err.textContent='Please add your full name.';f.name.focus();return;}
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Please add an email we can reach you at.';f.email.focus();return;}
  if(!$('#f-pdpa').checked){err.textContent='Please accept the Privacy Notice to continue.';return;}
  err.textContent='';
  const interests=$$('#f-int .chip.on').map(c=>c.dataset.v);
  // New demo guest replaces any previous one
  if(S.me){ S.bookings=S.bookings.filter(b=>b.memberId!=='me'); S.members=S.members.filter(m=>m.id!=='me'); const codes=new Set(S.me.vouchers.map(v=>v.code)); S.vouchers=S.vouchers.filter(v=>!codes.has(v.code)); }
  S.me = makeMe({name,email,phone:f.phone.value.trim(),city:f.city.value,interests,tier:f.tier.value,source:f.source.value.trim()||'sumnight.com'});

function flushPhoneToasts(){
  const me=S.me; if(!me||!me.toasts.length) { const b=$('#lbody'); if(b) b.scrollTop=b.scrollHeight; return; }
  const t=me.toasts.shift(); save();
  const sc=$('#screen'); if(!sc) return;
  const el=document.createElement('div'); el.className='ptoast'; el.dataset.act='toastopen';
  el.innerHTML=`<span class="ai">LINE</span><div><b>sumnight <small>now</small></b><p>${esc(t.text)}</p></div>`;
  sc.appendChild(el);
  const b=$('#lbody'); if(b) b.scrollTop=b.scrollHeight;
  setTimeout(()=>{ el.remove(); if(S.me&&S.me.toasts.length) flushPhoneToasts(); },4200);
}

      <div class="kpi"><span class="eyebrow">Confirmed · next 7 days</span><b class="num">${next7.length}</b><small>${next7.reduce((a,b)=>a+b.guests,0)} guests</small></div>
      <div class="kpi"><span class="eyebrow">Avg. reply time</span><b class="num">${isC?'18':'14'}<span style="font-size:18px"> min</span></b><small>Last 30 days</small></div>
      <div class="kpi"><span class="eyebrow">Vouchers redeemed</span><b class="num">${redeemed}</b><small>This month</small></div>
    </div>
    <div class="cols">
      <div class="panel"><div class="panel-h"><h3>Needs a reply</h3><small>Oldest first · target ${SLA_MIN} min</small></div>
        ${req.length?req.map(b=>{const m=member(b.memberId),vv=V(b.venue),l=minsSince(b.created)>SLA_MIN;return `<button class="att" data-act="open" data-b="${b.id}"><span class="sw ${l?'late':''}"></span><div><b>${esc(m.name)}${b.memberId==='me'?'<span class="me-tag">You</span>':''} · <span class="tchip">${esc(m.tier)}</span></b><small>${esc(vv.name)} · ${when(b)} · ${party(b)}</small></div><span class="w ${l?'late':''}">${ago(b.created)}</span></button>`}).join(''):'<div class="empty">Every request has a reply.</div>'}
      </div>
      <div class="panel"><div class="panel-h"><h3>Next 7 days</h3><small>Requested and confirmed</small></div>
        <div class="chart">
          <div class="legend">${Object.keys(CATS).map(c=>`<span><i class="c-${c}"></i>${CATS[c]}</span>`).join('')}</div>
          <div class="bars">${counts.map(o=>{const t=o.stay+o.dine+o.restore;return `<div class="col">${['stay','dine','restore'].map(c=>o[c]?`<span class="c-${c}" style="height:${o[c]/max*100}%" title="${o[c]} ${CATS[c]}"></span>`:'').join('')}${t?`<em style="bottom:${t/max*100}%;top:auto;transform:none;margin-bottom:4px">${t}</em>`:''}</div>`}).join('')}</div>

function adBookings(){

  const labels={requested:'Requests',alternative:'Time offered',confirmed:'Confirmed',past:'Past & closed',all:'All'};
  let list=bs.filter(b=>!groups[U.bStatus]||groups[U.bStatus].includes(b.status));
  if(U.bCat!=='all') list=list.filter(b=>V(b.venue).cat===U.bCat);
  if(U.q){const q=U.q.toLowerCase();list=list.filter(b=>(member(b.memberId).name+' '+b.ref+' '+V(b.venue).name).toLowerCase().includes(q));}
  list.sort(U.bStatus==='requested'?(a,b)=>a.created-b.created:U.bStatus==='past'?(a,b)=>b.date.localeCompare(a.date):(a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const body = U.bView==='board' ? boardView(bs) : `<div class="tblw"><table><thead><tr><th>Ref</th><th>Member</th><th>House</th><th>When</th><th>Party</th><th>Voucher</th><th>Status</th><th class="r">${U.bStatus==='requested'?'Waiting':'Requested'}</th></tr></thead><tbody>
    ${list.map(b=>{const m=member(b.memberId),v=V(b.venue),l=b.status==='requested'&&minsSince(b.created)>SLA_MIN;return `<tr data-act="open" data-b="${b.id}"><td class="num">${b.ref}</td><td>${esc(m.name)}${b.memberId==='me'?'<span class="me-tag">You</span>':''}<span class="s"><span class="tchip">${esc(m.tier)}</span> · ${esc(m.no)}</span></td><td>${catDot(v.cat)}${esc(v.name)}</td><td>${when(b)}</td><td class="num">${b.guests}</td><td>${b.voucher?esc(b.voucher.title):'<span class="s">—</span>'}</td><td><span class="pill st-${b.status}">${STATUS[b.status]}</span></td><td class="r num ${l?'late':''}">${ago(b.created)}</td></tr>`}).join('')}
    </tbody></table>${list.length?'':'<div class="empty">No bookings match these filters.</div>'}</div>`;

    <div class="r"><input class="search" id="q" data-bind="q" placeholder="Search member, ref, house" value="${esc(U.q)}"><div class="fchips"><button class="fchip ${U.bView==='list'?'on':''}" data-act="bview" data-v="list">List</button><button class="fchip ${U.bView==='board'?'on':''}" data-act="bview" data-v="board">Week</button></div></div></div>
    ${U.bView==='list'?`<div class="tabs">${Object.keys(groups).map(k=>`<button class="${U.bStatus===k?'on':''}" data-act="bstatus" data-s="${k}">${labels[k]}<span class="c">${bs.filter(b=>!groups[k]||groups[k].includes(b.status)).length}</span></button>`).join('')}</div>`:''}
    <div class="filters"><div class="fchips">${['all','stay','dine','restore'].map(c=>`<button class="fchip ${U.bCat===c?'on':''}" data-act="bcat" data-c="${c}">${c==='all'?'All':CATS[c]}</button>`).join('')}</div><small style="color:var(--mute-l)">Tap a booking to reply</small></div>
    ${body}`;
}

  }
  return `<div class="drawer-bg" data-act="closedrawer"></div><aside class="drawer" role="dialog" aria-label="Booking ${b.ref}">
    <div class="dh"><div class="top"><span class="ref num">${b.ref}</span><button class="x" data-act="closedrawer" aria-label="Close">×</button></div><h3>${esc(v.name)}</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill st-${b.status}" style="background:rgba(255,255,255,.1);color:var(--pink)">${STATUS[b.status]}</span><span style="color:var(--mute-d);font-size:13px">Requested ${minsSince(b.created)<1?'just now':ago(b.created)+' ago'}</span></div></div>
    <div class="db">
      <div class="dsec"><h6>Member</h6><div class="mbox"><span class="av">${esc(initials(m.name))}</span><div><b>${esc(m.name)}${b.memberId==='me'?'<span class="me-tag">You</span>':''}</b><small><span class="tchip">${esc(m.tier)}</span> · ${esc(m.no)} · ${esc(m.city||'')}</small></div>${m.note?`<p>${esc(m.note)}</p>`:''}</div></div>
      <div class="dsec"><h6>Request</h6><dl class="dl"><dt>${stay?'Check-in':'Date'}</dt><dd>${fmtD(b.date)}</dd>${stay?`<dt>Nights</dt><dd>${b.nights}</dd>`:`<dt>Time</dt><dd>${b.time}</dd>`}<dt>Party</dt><dd>${party(b)}</dd><dt>Voucher</dt><dd>${b.voucher?`${esc(b.voucher.title)}<br><span class="num" style="color:var(--mute-l);font-size:12.5px">${esc(b.voucher.code)}</span>`:'—'}</dd>${b.note?`<dt>Note</dt><dd>${esc(b.note)}</dd>`:''}${b.conf?`<dt>Confirmation</dt><dd class="num">${esc(b.conf)}</dd>`:''}${b.reason?`<dt>Reason</dt><dd>${esc(b.reason)}</dd>`:''}</dl></div>
      ${acts?`<div class="dsec"><h6>Reply</h6>${acts}</div>`:''}
      <div class="dsec"><h6>History</h6><ul class="hist">${b.history.slice().reverse().map(h=>`<li><span class="num">${new Date(h.ts).toLocaleDateString(LOC(),{day:'numeric',month:'short'})} ${hhmm(h.ts)}</span><span>${esc(h.text)}</span></li>`).join('')}</ul></div>
    </div></aside>`;
}
function adWaitlist(){
  const me=S.me;
  const rows=[];
  if(me&&me.stage!=='member') rows.push({id:'me',name:me.name,email:me.email,city:me.city,interests:me.interests,tier:me.tierInterest,at:me.at,status:me.stage==='registered'?'profile':'waiting',source:me.source,isMe:true});
  rows.push(...S.waitlist.filter(w=>w.status!=='approved'));
  const lbl={waiting:'Waiting',invited:'Invited on LINE',profile:'Profile complete'};
  const cls={waiting:'st-completed',invited:'st-alternative',profile:'st-requested'};
  return `<div class="mh"><div><div class="eyebrow">Next committee review · ${fmtLong(day(7))}</div><h1>Waiting list</h1></div><div class="r"><small style="color:var(--mute-l)">${rows.length} applicants · ${S.members.length} members</small></div></div>
    <div class="tblw"><table><thead><tr><th>No.</th><th>Applicant</th><th>City</th><th>Interests</th><th>Wants</th><th>Source</th><th>Status</th><th class="r">Action</th></tr></thead><tbody>
    ${rows.map((w,i)=>`<tr style="cursor:default"><td class="num">${w.isMe?me.pos:248+S.waitlist.indexOf(w)}</td><td>${esc(w.name)}${w.isMe?'<span class="me-tag">You</span>':''}<span class="s">${esc(w.email)} · ${ago(w.at)} ago</span></td><td>${esc(w.city)}</td><td>${w.interests.map(c=>catDot(c)+CATS[c]).join(' ')}</td><td><span class="tchip">${esc(w.tier)}</span></td><td><span class="s" style="color:var(--text-l)">${esc(w.source)}</span></td><td><span class="pill ${cls[w.status]}">${lbl[w.status]}</span></td>
      <td><div class="wl-act">${w.status==='waiting'&&!w.isMe?`<button class="btn btn-ghost-l btn-sm" data-act="wlinvite" data-w="${w.id}">Invite on LINE</button>`:''}<select id="tier-${w.id}" aria-label="Tier">${['Dusk','Midnight','Eclipse'].map(t=>`<option ${t===w.tier?'selected':''}>${t}</option>`).join('')}</select><button class="btn btn-ink btn-sm" data-act="wlapprove" data-w="${w.id}">Approve</button></div></td></tr>`).join('')}
    </tbody></table>${rows.length?'':'<div class="empty">The waiting list is clear.</div>'}</div>
    ${me&&me.stage==='waitlisted'?`<p style="margin-top:14px;font-size:13px;color:var(--mute-l)">Tip for the demo: complete the LIFF profile on the phone first, then approve here to issue the card on LINE.</p>`:''}`;
}
function adMembers(){
  const list=S.members.slice().sort((a,b)=>a.no.localeCompare(b.no));
  return `<div class="mh"><div><div class="eyebrow">${list.length} active</div><h1>Members</h1></div></div>
    <div class="tblw"><table><thead><tr><th>Member</th><th>Tier</th><th>Since</th><th>City</th><th class="r">Visits this year</th><th class="r">Upcoming</th><th>Preferences</th></tr></thead><tbody>
    ${list.map(m=>{const up=S.bookings.filter(b=>b.memberId===m.id&&['requested','confirmed','alternative'].includes(b.status)).length;return `<tr style="cursor:default"><td>${esc(m.name)}${m.id==='me'?'<span class="me-tag">You</span>':''}<span class="s num">${esc(m.no)}</span></td><td><span class="tchip">${esc(m.tier)}</span></td><td>${fmtS(m.since)}</td><td>${esc(m.city)}</td><td class="r num">${m.visits}</td><td class="r num">${up}</td><td><span class="s" style="color:var(--text-l);max-width:32ch">${esc(m.note||'—')}</span></td></tr>`}).join('')}
    </tbody></table></div>`;
}
function adPartners(){
  return `<div class="mh"><div><div class="eyebrow">Founding houses</div><h1>Partner houses</h1></div></div>
    <div class="pcards">${VENUES.map((v,i)=>{const bs=S.bookings.filter(b=>b.venue===v.id);const conf=bs.filter(b=>['confirmed','completed'].includes(b.status)).length;const rate=bs.length?Math.round(conf/bs.filter(b=>b.status!=='requested').length*100)||0:0;
      return `<article class="pcard">${pic(v.id,700)}<div class="b"><div><span class="eyebrow">${CATS[v.cat]} · ${v.place}</span><h4 style="margin-top:6px">${v.name}</h4></div>
      <div class="pstats"><div><b class="num">${bs.length}</b><small>Requests</small></div><div><b class="num">${[12,9,21,8,15,19,11,26][i]}m</b><small>Avg. reply</small></div><div><b class="num">${rate}%</b><small>Confirmed</small></div></div>
      <button class="btn btn-ghost-l btn-sm" data-act="viewas" data-v="${v.id}">View as this house</button></div></article>`}).join('')}</div>`;
}
function adRedeem(){
  const isC=U.role==='concierge';
  const exp=S.bookings.filter(b=>b.voucher&&['confirmed','requested'].includes(b.status)&&(isC||b.venue===U.role)&&b.date<=day(3)).sort((a,b)=>a.date.localeCompare(b.date));
  const r=U.redeem;
  let res='';
  if(r){
    if(!r.v) res=`<div class="rres bad"><h4>Code not found</h4><p>Check the code with the guest, or ask them to open the voucher in LINE.</p></div>`;
    else { const vv=V(r.v.venue); const wrong=!isC&&r.v.venue!==U.role; const expd=r.v.exp<day(0);
      const bad=wrong||expd||r.v.status==='used';
      res=`<div class="rres ${bad?'bad':''}"><span class="eyebrow" style="color:${bad?'var(--bad)':'var(--ok)'}">${r.v.status==='used'?'Already redeemed':wrong?'Different house':expd?'Expired':'Valid'}</span><h4>${esc(r.v.title)}</h4>
        <dl class="dl"><dt>Holder</dt><dd>${esc(r.v.holder)}</dd><dt>House</dt><dd>${esc(vv?vv.name:'Any')}</dd><dt>Valid until</dt><dd>${fmtLong(r.v.exp)}</dd><dt>Code</dt><dd class="num">${esc(r.v.code)}</dd>${r.v.usedAt?`<dt>Redeemed</dt><dd>${new Date(r.v.usedAt).toLocaleString(LOC(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</dd>`:''}</dl>
        ${bad?'':`<button class="btn btn-ink" data-act="doredeem" data-c="${esc(r.v.code)}">Redeem now</button>`}</div>`; }
  }
  return `<div class="mh"><div><div class="eyebrow">${isC?'All houses':esc(V(U.role).name)}</div><h1>Redeem voucher</h1></div></div>
    <div class="redeem">
      <div class="rbox"><h3>Check a code</h3><p>Scan the QR in the guest’s LINE wallet, or type the code printed under it.</p>
        <form class="rin" id="rform"><input id="r-code" placeholder="SN-XXXX-XXXX" autocomplete="off" value="${esc(r?.q||'')}"><button class="btn btn-pink" type="submit">Check</button></form>${res}</div>
      <div class="panel"><div class="panel-h"><h3>Expected in the next 3 days</h3><small>Vouchers attached to bookings</small></div>
        ${exp.length?exp.map(b=>{const m=member(b.memberId),v=V(b.venue);return `<button class="att" data-act="fillcode" data-c="${esc(b.voucher.code)}"><span class="sw" style="background:${CATCOL[v.cat]}"></span><div><b>${esc(b.voucher.title)}</b><small>${esc(m.name)} · ${esc(v.name)} · ${when(b)}</small></div><span class="w num">${esc(b.voucher.code)}</span></button>`}).join(''):'<div class="empty">No vouchers expected.</div>'}
      </div>
    </div>`;
}
function ctoast(text,sub){ const el=$('#ctoast'); el.innerHTML=`<div class="ctoast">${esc(text)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; clearTimeout(ctoast._t); ctoast._t=setTimeout(()=>el.innerHTML='',3600); }

/* ---- Booking state changes (shared by console + member app) ---- */
function notifyMe(b,state,toast){ if(b.memberId!=='me') return; pushChat({from:'oa',k:'flex',kind:'booking',bid:b.id,state}, toast); }
function setVoucher(code,status){ [S.vouchers, S.me?S.me.vouchers:[]].forEach(arr=>arr.forEach(v=>{ if(v.code===code){ v.status=status; if(status==='used') v.usedAt=Date.now(); }})); }

/* =========================================================
   Events
   ========================================================= */
const ACT = {
  lang(){ LANG=LANG==='th'?'en':'th'; try{localStorage.setItem('sumnight-lang',LANG);}catch(e){} document.documentElement.lang=LANG; render(); },
  fontpick(){ U.fontpop=!U.fontpop; renderFontPop(); },
  setfont(t){ applyFont(t.dataset.f); if(LANG!=='th'){ LANG='th'; try{localStorage.setItem('sumnight-lang','th');}catch(e){} document.documentElement.lang='th'; render(); } else renderFontPop(); },
  reset(){ try{localStorage.removeItem(KEY);}catch(e){} S=seed(); Object.assign(U,{phone:'chat',sheet:false,tab:'home',bookVenue:null,bf:null,qr:false,justBooked:null,page:'overview',role:'concierge',bStatus:'requested',bCat:'all',bView:'list',q:'',drawer:null,dmode:null,redeem:null}); save(); ctoast('Demo reset','All sample data restored.'); go('home'); },
  scroll(t){ const el=document.getElementById(t.dataset.to); if(el) el.scrollIntoView({behavior:'smooth'}); if(t.dataset.tier){ const s=$('#f-tier'); if(s) s.value=t.dataset.tier; } },
  chip(t){ t.classList.toggle('on'); },
  fillform(){ const f=$('#wlform'); f.name.value='Ananya Rattanakul'; f.email.value='ananya.r@example.com'; f.phone.value='081 234 5678'; f.city.value='Bangkok'; $('#f-pdpa').checked=true; $('#f-err').textContent=''; },
  closemodal(t,e){ if(e.target.closest('[data-stop]') && !t.matches('a')) return; $('#overlay').innerHTML=''; },
  partnerview(){ U.role='mcp'; U.page='bookings'; U.bStatus='requested'; go('admin'); },
  /* phone */
  liff(t){ const me=S.me, to=t.dataset.to;
    if(me.stage==='waitlisted'){ U.sheet=true; return render(); }
    if(me.stage==='registered'){ U.phone='pending'; return render(); }
    U.phone='app'; U.tab= to==='register'?'home':to; U.justBooked=null; render(); },
  allow(){ U.sheet=false; U.phone='register'; render(); },
  deny(){ U.sheet=false; render(); },
  tochat(){ U.phone='chat'; U.qr=false; render(); },
  simapprove(){ issueMembership(S.me.tierInterest==='Eclipse'?'Midnight':S.me.tierInterest); save(); U.phone='chat'; render(); },
  fastforward(){ const me=S.me; if(me.stage==='waitlisted'){ me.stage='registered'; } issueMembership(me.tierInterest==='Eclipse'?'Midnight':me.tierInterest); save(); U.phone='app'; U.tab='home'; render(); },
  tab(t){ U.tab=t.dataset.t; U.justBooked=null; U.qr=false; if(U.tab==='book'&&!U.bookVenue){} render(); const lf=$('#lf'); if(lf) lf.scrollTop=0; },
  showqr(t){ U.qr={code:t.dataset.code,title:t.dataset.title}; render(); },
  closeqr(){ U.qr=false; render(); },
  bookcat(t){ U.bookCat=t.dataset.c; render(); },
  pickvenue(t){ const v=V(t.dataset.v); U.bookVenue=v.id; U.bf={date:day(v.cat==='stay'?7:1),time:slotsFor(v.cat)[2],guests:2,nights:2,voucher:'',note:''}; render(); const lf=$('#lf'); if(lf) lf.scrollTop=0; },
  unpick(){ U.bookVenue=null; render(); },
  booknew(){ U.justBooked=null; U.bookVenue=null; render(); },
  bfdate(t){ U.bf.date=t.dataset.d; keepScroll(render); },
  bftime(t){ U.bf.time=t.dataset.t; keepScroll(render); },
  bfstep(t){ const k=t.dataset.k; U.bf[k]=Math.max(1,Math.min(k==='nights'?14:8,U.bf[k]+Number(t.dataset.d))); keepScroll(render); },
  bfv(t){ U.bf.voucher=t.dataset.c; keepScroll(render); },
  submitbooking(){ const me=S.me, bf=U.bf, v=V(U.bookVenue);
    const vc=bf.voucher?me.vouchers.find(x=>x.code===bf.voucher):null;
    const id='b'+(++S.seq);
    const b={id,ref:'SNB-'+(2400+S.seq),memberId:'me',venue:v.id,date:bf.date,time:v.cat==='stay'?'15:00':bf.time,nights:v.cat==='stay'?bf.nights:1,guests:bf.guests,status:'requested',voucher:vc?{code:vc.code,title:vc.title}:null,note:bf.note,created:Date.now(),conf:'',altDate:'',altTime:'',reason:'',history:[{ts:Date.now(),text:'Requested in LINE'}]};
    S.bookings.push(b); if(vc) setVoucher(vc.code,'reserved');
    pushChat({from:'oa',k:'text',key:'received',bid:b.id});
    save(); U.justBooked=id; U.bookVenue=null; render(); ctoast('New booking request', `${v.name} · ${when(b)}`); },
  acceptalt(t){ const b=S.bookings.find(x=>x.id===t.dataset.b); b.date=b.altDate; b.time=b.altTime||b.time; b.status='confirmed'; b.conf=b.conf||(b.venue.slice(0,3).toUpperCase()+'-'+Math.floor(10000+Math.random()*89999)); b.history.push({ts:Date.now(),text:'Member accepted the new time · '+b.conf}); pushChat({from:'oa',k:'flex',kind:'booking',bid:b.id,state:'confirmed'}); save(); render(); },
  declinealt(t){ const b=S.bookings.find(x=>x.id===t.dataset.b); b.status='cancelled'; b.history.push({ts:Date.now(),text:'Member declined the new time'}); if(b.voucher) setVoucher(b.voucher.code,'active'); save(); render(); },
  toastopen(){ U.phone='chat'; U.qr=false; render(); },
  /* console */
  page(t){ U.page=t.dataset.p; U.drawer=null; U.redeem=null; render(); },
  viewas(t){ U.role=t.dataset.v; U.page='overview'; render(); },
  bstatus(t){ U.bStatus=t.dataset.s; render(); },
  bcat(t){ U.bCat=t.dataset.c; render(); },
  bview(t){ U.bView=t.dataset.v; render(); },
  open(t){ U.drawer=t.dataset.b; U.dmode=null; $('#overlay').innerHTML=viewDrawer(); },
  closedrawer(){ U.drawer=null; U.dmode=null; $('#overlay').innerHTML=''; },
  dmode(t){ U.dmode=t.dataset.m||null; $('#overlay').innerHTML=viewDrawer(); $('.drawer').style.animation='none'; $('.drawer-bg').style.animation='none'; },
  doconfirm(){ const b=S.bookings.find(x=>x.id===U.drawer), v=V(b.venue); b.status='confirmed'; b.conf=$('#d-conf').value.trim()||b.conf; const note=$('#d-msg').value.trim();
    b.history.push({ts:Date.now(),text:`Confirmed by ${v.name} · ${b.conf}`}); if(note) b.history.push({ts:Date.now(),text:'Note to member: '+note});
    notifyMe(b,'confirmed',`${v.name}: your booking on ${fmtS(b.date)} is confirmed.`); save(); closeAndRefresh('Confirmed and sent on LINE', `${member(b.memberId).name} · ${b.ref}`); },
  doalt(){ const b=S.bookings.find(x=>x.id===U.drawer), v=V(b.venue); b.status='alternative'; b.altDate=$('#d-adate').value; b.altTime=$('#d-atime')?$('#d-atime').value:b.time;
    b.history.push({ts:Date.now(),text:`${v.name} offered ${fmtS(b.altDate)}${v.cat==='stay'?'':' · '+b.altTime}`}); notifyMe(b,'alternative',`${v.name} has offered another time. Tap to review.`); save(); closeAndRefresh('Offer sent on LINE', `${member(b.memberId).name} · ${b.ref}`); },
  dodecline(){ const b=S.bookings.find(x=>x.id===U.drawer), v=V(b.venue); b.status='declined'; b.reason=$('#d-reason').value; b.history.push({ts:Date.now(),text:`Declined by ${v.name}: ${b.reason}`}); if(b.voucher) setVoucher(b.voucher.code,'active');
    notifyMe(b,'declined',`${v.name} could not confirm your request.`); save(); closeAndRefresh('Declined and member notified', b.ref); },
  dostatus(t){ const b=S.bookings.find(x=>x.id===U.drawer); const s=t.dataset.s; b.status=s; b.history.push({ts:Date.now(),text:{completed:'Guest arrived',noshow:'Marked as no-show',cancelled:'Cancelled by the house'}[s]});
    if(b.voucher){ setVoucher(b.voucher.code, s==='completed'?'used':s==='cancelled'?'active':'used'); }
    if(b.memberId==='me'&&s==='completed'&&S.me){ S.me.visitsDemo=(S.me.visitsDemo??3)+1; S.members.forEach(m=>{if(m.id==='me')m.visits++;}); }
    save(); closeAndRefresh(STATUS[s], b.ref); },
  forcealt(){ const b=S.bookings.find(x=>x.id===U.drawer); ACT.acceptalt({dataset:{b:b.id}}); closeAndRefresh('Confirmed', b.ref); },
  wlinvite(t){ const w=S.waitlist.find(x=>x.id===t.dataset.w); w.status='invited'; save(); render(); ctoast('Invitation sent on LINE', w.name); },
  wlapprove(t){ const id=t.dataset.w, tier=$('#tier-'+id).value;
    if(id==='me'){ const me=S.me; if(me.stage==='waitlisted') me.stage='registered'; issueMembership(tier); save(); render(); ctoast(`${me.name} approved · ${tier}`,'Card and vouchers sent on LINE'); return; }
    const w=S.waitlist.find(x=>x.id===id); w.status='approved'; const n=S.members.length+120;
    S.members.push({id:'m'+(++S.seq),name:w.name,tier,no:'SN-0'+n,since:day(0),city:w.city,visits:0,note:''}); save(); render(); ctoast(`${w.name} approved · ${tier}`,'Card and vouchers sent on LINE'); },
  fillcode(t){ U.redeem={q:t.dataset.c,v:findVoucher(t.dataset.c)}; render(); },
  doredeem(t){ setVoucher(t.dataset.c,'used'); const b=S.bookings.find(x=>x.voucher&&x.voucher.code===t.dataset.c&&['confirmed','requested'].includes(x.status)); if(b) b.history.push({ts:Date.now(),text:'Voucher redeemed at the house'});
    if(S.me&&S.me.vouchers.some(v=>v.code===t.dataset.c)){ const vc=S.me.vouchers.find(v=>v.code===t.dataset.c); pushChat({from:'oa',k:'text',key:'redeemed',title:vc.title},`Voucher redeemed: ${vc.title}`); }
    save(); U.redeem={q:t.dataset.c,v:findVoucher(t.dataset.c)}; render(); ctoast('Voucher redeemed', t.dataset.c); }
};
function findVoucher(code){ code=String(code||'').trim().toUpperCase(); return S.vouchers.find(v=>v.code===code) || (S.me&&S.me.vouchers.find(v=>v.code===code)) || null; }
function closeAndRefresh(msg,sub){ U.drawer=null; U.dmode=null; render(); ctoast(msg,sub); }
function keepScroll(fn){ const lf=$('#lf'), y=lf?lf.scrollTop:0; const dx=$('.dates'), x=dx?dx.scrollLeft:0; fn(); const n=$('#lf'); if(n) n.scrollTop=y; const nd=$('.dates'); if(nd) nd.scrollLeft=x; }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act; if(!ACT[a]) return;
  if(t.tagName==='A' && a!=='closemodal') e.preventDefault();
  if(a==='closemodal' && t.tagName!=='A' && e.target!==t) return;
  ACT[a](t,e);
});
document.addEventListener('submit',e=>{
  if(e.target.id==='wlform') return submitWaitlist(e);
  if(e.target.id==='regform'){ e.preventDefault();
    if(!$('#r-pdpa').checked){ $('#r-err').textContent='Consent is needed so houses can receive your preferences.'; return; }
    const me=S.me; me.name=$('#r-name').value.trim()||me.name; me.phone=$('#r-phone').value.trim(); me.birthday=$('#r-bday').value; me.dietary=$('#r-diet').value; me.occasion=$('#r-occ').value.trim();
    me.interests=$$('#r-int .chip.on').map(c=>c.dataset.v); me.stage='registered';
    pushChat({from:'oa',k:'text',key:'profile'});
    save(); U.phone='pending'; render(); return; }
  if(e.target.id==='rform'){ e.preventDefault(); const q=$('#r-code').value; U.redeem={q,v:findVoucher(q)}; render(); }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.bind; if(!k) return;
  if(k==='note'&&U.bf) U.bf.note=e.target.value;
  if(k==='q'){ U.q=e.target.value; U._focusQ=true; render(); U._focusQ=false; }
});
document.addEventListener('change',e=>{ if(e.target.dataset.change==='role'){ U.role=e.target.value; U.drawer=null; U.redeem=null; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(U.fontpop) ACT.fontpick(); else if(U.drawer) ACT.closedrawer(); else if($('.modal-bg')) $('#overlay').innerHTML=''; else if(U.qr) ACT.closeqr(); }});
setInterval(()=>{ if(route()==='admin' && !U.drawer && !(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render(); },60000);

render();
</script>
